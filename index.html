<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/sonarix_icon_1024.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonarix</title>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(124, 58, 237, 0.12), transparent 70%),
          linear-gradient(160deg, #0f0a1e 0%, #070718 45%, #0a1020 100%);
        font-family: "Segoe UI", system-ui, sans-serif;
        transition: opacity 0.45s ease, transform 0.45s ease;
      }
      #app-splash.app-splash--out {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }
      #app-splash .app-splash__glow {
        position: absolute;
        width: 280px;
        height: 280px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(124, 58, 237, 0.35) 0%, transparent 70%);
        filter: blur(24px);
        animation: splash-pulse 2.4s ease-in-out infinite;
      }
      #app-splash .app-splash__icon-wrap {
        position: relative;
        width: 128px;
        height: 128px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      #app-splash .app-splash__ring {
        position: absolute;
        inset: 0;
        border-radius: 28%;
        border: 1.5px solid rgba(124, 58, 237, 0.35);
        animation: splash-spin 3s linear infinite;
      }
      #app-splash .app-splash__ring--inner {
        inset: 10px;
        border-color: rgba(236, 72, 153, 0.25);
        animation-direction: reverse;
        animation-duration: 2.2s;
      }
      #app-splash .app-splash__icon {
        position: relative;
        width: 96px;
        height: 96px;
        border-radius: 22%;
        object-fit: cover;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08),
          0 0 48px rgba(124, 58, 237, 0.35);
        animation: splash-icon-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #app-splash .app-splash__title {
        margin: 0;
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: #eaeaf5;
        animation: splash-fade-up 0.6s 0.15s ease both;
      }
      #app-splash .app-splash__tagline {
        margin: 6px 0 28px;
        font-size: 0.8rem;
        color: #7a7a96;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        animation: splash-fade-up 0.6s 0.25s ease both;
      }
      #app-splash .app-splash__loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        animation: splash-fade-up 0.6s 0.35s ease both;
      }
      #app-splash .app-splash__loader-bar {
        display: block;
        width: 120px;
        height: 3px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        position: relative;
      }
      #app-splash .app-splash__loader-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        background: linear-gradient(90deg, #7c3aed, #ec4899);
        border-radius: inherit;
        animation: splash-bar 1.2s ease-in-out infinite;
      }
      #app-splash .app-splash__loader-text {
        font-size: 0.72rem;
        color: #52527a;
      }
      @keyframes splash-pulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.08); }
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes splash-icon-in {
        from { opacity: 0; transform: scale(0.85) translateY(12px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes splash-fade-up {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes splash-bar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(280%); }
      }
    </style>
  </head>

  <body>
    <div id="app-splash" role="status" aria-live="polite" aria-label="Sonarix loading">
      <div class="app-splash__glow" aria-hidden="true"></div>
      <div class="app-splash__icon-wrap">
        <div class="app-splash__ring app-splash__ring--outer" aria-hidden="true"></div>
        <div class="app-splash__ring app-splash__ring--inner" aria-hidden="true"></div>
        <img src="/sonarix_icon_1024.png" alt="" class="app-splash__icon" width="96" height="96" draggable="false" />
      </div>
      <h1 class="app-splash__title">Sonarix</h1>
      <p class="app-splash__tagline">Local music, your way</p>
      <div class="app-splash__loader">
        <span class="app-splash__loader-bar"></span>
        <span class="app-splash__loader-text">Starting up…</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
